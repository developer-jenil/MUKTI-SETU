services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    env_file: [.env]
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: mukti
      POSTGRES_USER: mukti
      POSTGRES_PASSWORD: mukti
    volumes: [mukti-data:/var/lib/postgresql/data]
volumes:
  mukti-data:
